
name: Build Panchal Samaj Modasa APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare website files
        run: |
          mkdir -p www
          rsync -av ./ www/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='www' \
            --exclude='android' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='capacitor.config.json'
          test -f www/index.html

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@^7 @capacitor/android@^7
          npm install --save-dev @capacitor/cli@^7

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.panchalsamajmodasa.app",
            "appName": "Panchal Samaj Modasa",
            "webDir": "www"
          }
          EOF

      - name: Generate Android project
        run: npx cap add android

      - name: Synchronize website
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Panchal-Samaj-Modasa-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
